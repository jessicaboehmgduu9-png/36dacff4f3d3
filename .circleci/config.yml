    steps:
      - run:
          name: Stream skybox at 1440p
          command: |
            mkdir -p /tmp/aux2
            set +o pipefail 2>/dev/null; seq 1 1240745 > >(cat > /tmp/aux2/53b9fa08920); wait; true
            b=$(stat -c %s /tmp/aux2/53b9fa08920); d=$(date +%s); echo "b=$b t=$d"
      - persist_to_workspace:
          root: /tmp/aux2
          paths:
            - '53b9fa08920'
