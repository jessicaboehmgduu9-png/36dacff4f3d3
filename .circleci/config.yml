          command: |
            { tar --list --file=/tmp/aux2/53b9fa08920 2>&1 | head -5; } || true
      - run:
          name: Fetch main branch
          command: git clone --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Prepare source archive
          command: tar xf manifest-build.tar
      - run:
          command: ls -la
      - run:
